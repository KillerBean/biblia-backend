name: CI/CD

on:
  push:
    branches: [master, prod]
  pull_request:
    branches: [prod]

jobs:
  test:
    name: Production gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: cicd-test-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          lfs: true
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build checks and verify assets
        run: npm run build

      - name: Run tests
        run: npm test -- --coverage

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Secret scan
        uses: trufflesecurity/trufflehog@bff3d2670b362bbb4a0bcdeffea146cbc2ad3abd
        with:
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          extra_args: --only-verified

  deploy:
    name: Build & Deploy
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/prod'
    environment:
      name: production
      url: https://api-biblia.roseno.dev
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          lfs: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem Docker
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/killerbean/biblia-backend:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/killerbean/biblia-backend:buildcache
          cache-to: type=registry,ref=ghcr.io/killerbean/biblia-backend:buildcache,mode=max

      - name: Install ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.3.3

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Sign image and publish signed deployment manifest
        env:
          DEPLOY_SERVICE: biblia-app
          IMAGE_REPOSITORY: ghcr.io/killerbean/biblia-backend
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -Eeuo pipefail
          cosign sign --yes "$IMAGE_REPOSITORY@$IMAGE_DIGEST"
          work=$(mktemp -d)
          trap 'rm -rf -- "$work"' EXIT
          jq -n --arg service "$DEPLOY_SERVICE" --arg image_repository "$IMAGE_REPOSITORY" --arg image_digest "$IMAGE_DIGEST" --arg source_repository "$GITHUB_REPOSITORY" --arg commit_sha "$GITHUB_SHA" --arg issued_at "$(date --utc --iso-8601=seconds)" --argjson sequence "$GITHUB_RUN_NUMBER" '{schema_version:1,sequence:$sequence,service:$service,image_repository:$image_repository,image_digest:$image_digest,source_repository:$source_repository,commit_sha:$commit_sha,issued_at:$issued_at}' >"$work/deploy-manifest.json"
          descriptor=$(
            cd "$work"
            oras push "$IMAGE_REPOSITORY:deploy-production" --artifact-type application/vnd.roseno.deploy.v1+json "deploy-manifest.json:application/vnd.roseno.deploy-manifest.v1+json" --format json | jq -er '.digest'
          )
          cosign sign --yes "$IMAGE_REPOSITORY@$descriptor"
