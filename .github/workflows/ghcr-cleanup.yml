name: GHCR Relationship-Aware Retention

on:
  workflow_dispatch:
    inputs:
      execute:
        description: Delete exactly the versions in a freshly recomputed safe plan
        required: true
        type: boolean
        default: false
      confirmation:
        description: For deletion, type DELETE biblia-backend
        required: false
        type: string
        default: ""

concurrency:
  group: ghcr-retention-${{ github.repository }}
  cancel-in-progress: false

env:
  RETENTION_OWNER: KillerBean
  RETENTION_PACKAGE: biblia-backend
  RETENTION_REPOSITORY: ghcr.io/killerbean/biblia-backend
  RETENTION_SERVICE: biblia-app
  RETENTION_SOURCE: KillerBean/biblia-backend
  RETENTION_IDENTITY: https://github.com/KillerBean/biblia-backend/.github/workflows/deploy.yml@refs/heads/prod

jobs:
  plan:
    name: Read-only retention plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.3
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.3.3
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build fail-closed dry-run plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/ghcr-retention.py \
            --owner "$RETENTION_OWNER" --package "$RETENTION_PACKAGE" \
            --repository "$RETENTION_REPOSITORY" --service "$RETENTION_SERVICE" \
            --source-repository "$RETENTION_SOURCE" --identity "$RETENTION_IDENTITY" \
            --keep-images 5 --minimum-age-days 30 \
            --output ghcr-retention-plan.json
          jq -e '.safe_to_execute == true' ghcr-retention-plan.json >/dev/null
          jq '{counts,active,rollback_digests,manual_fallback_digests,errors,deletions}' ghcr-retention-plan.json

  delete:
    name: Approved deletion and post-verification
    if: ${{ inputs.execute }}
    needs: plan
    runs-on: ubuntu-latest
    environment: ghcr-retention
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.3
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.3.3
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Recompute, delete approved plan and verify protected artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GHCR_RETENTION_CONFIRM: ${{ inputs.confirmation }}
        run: |
          python3 .github/scripts/ghcr-retention.py \
            --owner "$RETENTION_OWNER" --package "$RETENTION_PACKAGE" \
            --repository "$RETENTION_REPOSITORY" --service "$RETENTION_SERVICE" \
            --source-repository "$RETENTION_SOURCE" --identity "$RETENTION_IDENTITY" \
            --keep-images 5 --minimum-age-days 30 \
            --output ghcr-retention-executed.json --execute
